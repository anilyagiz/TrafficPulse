# Google Cloud Build CI/CD pipeline
# Trigger: Push to main branch
# Usage: gcloud builds submit --config gcp/cloudbuild.yaml

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trafficpulse:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trafficpulse:latest'
      - '-f'
      - 'app/Dockerfile'
      - 'app'
    dir: '.'
  
  # Step 2: Run security scan
  - name: 'gcr.io/cloud-builders/docker'
    id: 'security-scan'
    args:
      - 'run'
      - '--rm'
      - '-v'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - 'aquasec/trivy:latest'
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '0'  # Don't fail build on vulnerabilities (just warn)
      - 'gcr.io/$PROJECT_ID/trafficpulse:$SHORT_SHA'
  
  # Step 3: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/trafficpulse:$SHORT_SHA'
    waitFor: ['build-docker']
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/trafficpulse:latest'
    waitFor: ['build-docker']
  
  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'trafficpulse'
      - '--image'
      - 'gcr.io/$PROJECT_ID/trafficpulse:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_CONTRACT_ID=${_CONTRACT_ID},NEXT_PUBLIC_SOROBAN_RPC_URL=${_SOROBAN_RPC_URL}'
      - '--set-secrets'
      - 'NEXT_PUBLIC_APP_URL=trafficpulse-secrets:app-url'
    waitFor: ['push-image']
  
  # Step 5: Run E2E tests against deployed service
  - name: 'node:20-alpine'
    id: 'e2e-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd app
        npm ci
        export PLAYWRIGHT_BASE_URL=https://trafficpulse-${_REGION}-$PROJECT_ID.uc.r.appspot.com
        npm run test
    env:
      - 'PLAYWRIGHT_BASE_URL=https://trafficpulse-${_REGION}-$PROJECT_ID.uc.r.appspot.com'
    waitFor: ['deploy-cloud-run']
  
  # Step 6: Create deployment summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deployment-summary'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=========================================="
        echo "Deployment Summary"
        echo "=========================================="
        echo "Project: $PROJECT_ID"
        echo "Region: ${_REGION}"
        echo "Image: gcr.io/$PROJECT_ID/trafficpulse:$SHORT_SHA"
        echo "Service URL: https://trafficpulse-${_REGION}-$PROJECT_ID.uc.r.appspot.com"
        echo "=========================================="
    waitFor: ['e2e-tests']

# Substitutions (can be overridden at build time)
substitutions:
  _REGION: 'us-central1'
  _CONTRACT_ID: 'CDTUCJ52DABJ3GWL2N5Y5HOEHXA4IA3RUE6DILYFNHWUH4N67EHCWECC'
  _SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

# Timeout
timeout: '1200s'

# Tags for build
tags:
  - 'trafficpulse'
  - 'production'
  - 'cloud-run'
